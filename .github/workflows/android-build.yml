name: Android Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Optional: Restore Release Keystore from GitHub Secret if configured
      - name: Decode Keystore (Optional)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      # Optional: Restore google-services.json from GitHub Secret if configured
      - name: Configure Google Services (Optional)
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Step 1: Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 2: Validate APK Integrity & Requirements
      - name: Validate Generated Debug APK
        run: |
          echo "========================================="
          echo "       VERIFYING DEBUG APK BUILD         "
          echo "========================================="
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No APK generated by Gradle build!"
            exit 1
          fi
          
          echo "Generated APK: $APK_PATH"
          ls -lh "$APK_PATH"
          
          # Check size (> 1 MB = 1048576 bytes)
          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK Size: $SIZE bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: APK is smaller than 1MB (size: $SIZE bytes)! Not a valid production build."
            exit 1
          fi
          
          # Check zip integrity and manifest existence
          unzip -t "$APK_PATH" | grep -q "AndroidManifest.xml"
          if [ $? -ne 0 ]; then
            echo "ERROR: APK does not contain a valid AndroidManifest.xml!"
            exit 1
          fi
          
          echo "APK verification SUCCESSFUL! Valid Android binary confirmed."

      # Step 3: Copy APK to Destination Directories
      - name: Stage APK Files for Download
        run: |
          mkdir -p .build-outputs APK_DOWNLOAD
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk
          
          echo "Validating SHA-256 hashes..."
          HASH_1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH_2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "SHA256 (.build-outputs): $HASH_1"
          echo "SHA256 (APK_DOWNLOAD):   $HASH_2"
          
          if [ "$HASH_1" != "$HASH_2" ]; then
            echo "ERROR: Hash mismatch between staged APKs!"
            exit 1
          fi
          echo "Staged APKs verified identical."

      # Step 4: Upload Debug APK Artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # Step 5: Build Release AAB (Android App Bundle)
      - name: Build Release AAB (Android App Bundle)
        run: ./gradlew bundleRelease --stacktrace

      # Step 6: Validate & Stage AAB
      - name: Stage Release AAB for Download
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            mkdir -p AAB_DOWNLOAD
            cp "$AAB_PATH" AAB_DOWNLOAD/app-release.aab
            echo "AAB generated successfully: $(ls -lh AAB_DOWNLOAD/app-release.aab)"
            sha256sum AAB_DOWNLOAD/app-release.aab
          else
            echo "Warning: AAB file not found at expected path"
          fi

      # Step 7: Upload AAB Artifact
      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: AAB_DOWNLOAD/app-release.aab
          retention-days: 30
          if-no-files-found: warn

      # Step 8: Commit staged APK back to repository if workflow pushed by token
      - name: Commit Staged APK to Repository (Optional)
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add APK_DOWNLOAD/app-debug.apk .build-outputs/app-debug.apk AAB_DOWNLOAD/app-release.aab -f
          git commit -m "Automated build: Updated APK and AAB binaries [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }} || echo "Push skipped (token permissions or branch protection)"
